<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Arcadia — Gamepad Music Studio</title>
    <meta
      name="description"
      content="Browser-based musical instrument and beat-making studio played with game controllers."
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/webp" href="/logo.webp" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="theme-color" content="#1a1a1c" />
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('arcadia.theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme =
            stored === 'light'
              ? 'light'
              : stored === 'dark'
                ? 'dark'
                : prefersDark
                  ? 'dark'
                  : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {}
      })();
    </script>
  </head>
  <body
    class="bg-bg text-text antialiased selection:bg-accent/30 selection:text-text min-h-screen overflow-x-hidden font-sans"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
