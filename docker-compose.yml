services:
  web:
    build:
      context: .
      args:
        BASE_PATH: /
    ports:
      - '8080:80'
    restart: unless-stopped
  dev:
    profiles: ['dev']
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "npm ci && npm run dev -- --host"
    ports:
      - '5173:5173'
